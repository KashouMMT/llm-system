name: Deploy to production

on:
  push:
    branches: [deploy]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    name: Build & check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Install UI dependencies
        working-directory: ui
        run: npm ci

      - name: Lint
        working-directory: ui
        run: npx eslint src

      - name: Build UI
        working-directory: ui
        run: npm run build

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Compile backend
        run: python -m compileall -q app

      - uses: actions/upload-artifact@v4
        with:
          name: ui-dist
          path: ui/dist
          retention-days: 7

  image:
    name: Build & push image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile
          push: true
          tags: |
            ${{ vars.DOCKERHUB_USERNAME }}/llm-system:${{ github.sha }}
            ${{ vars.DOCKERHUB_USERNAME }}/llm-system:deploy
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: [build, image]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: ui-dist
          path: ui/dist

      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/id_deploy
          printf '%s\n' "${{ secrets.EC2_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/id_deploy ~/.ssh/known_hosts

      - name: Ship the SPA
        run: |
          rsync -az --delete -e "ssh -i ~/.ssh/id_deploy" \
            ui/dist/ \
            ${{ vars.EC2_USER }}@${{ vars.EC2_HOST }}:/var/www/llm-system/

      - name: Ship the nginx config
        run: |
          scp -i ~/.ssh/id_deploy deploy/nginx/llm-system.conf \
            ${{ vars.EC2_USER }}@${{ vars.EC2_HOST }}:/opt/llm-system/llm-system.conf

      - name: Release the backend
        run: |
          ssh -i ~/.ssh/id_deploy \
            ${{ vars.EC2_USER }}@${{ vars.EC2_HOST }} 'bash -s' <<'EOF'
          set -euo pipefail
          echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login -u "${{ vars.DOCKERHUB_USERNAME }}" --password-stdin
          cd /opt/llm-system
          export API_IMAGE="${{ vars.DOCKERHUB_USERNAME }}/llm-system:${{ github.sha }}"
          docker compose -f docker-compose.prod.yml pull
          docker compose -f docker-compose.prod.yml up -d
          sudo nginx -t && sudo systemctl reload nginx
          for i in $(seq 1 12); do
            curl -fsS http://localhost:8000/health >/dev/null && { echo healthy; exit 0; }
            sleep 5
          done
          echo "health check never passed"; exit 1
          EOF