# llm-system — career-lamp.com (holding page, HTTPS) + dev-test.career-lamp.com
# (app, HTTPS). TLS added via `certbot --nginx`; the cert lives at
# /etc/letsencrypt/live/career-lamp.com/ (one cert, all three names as SANs).
#
# This file is what CI ships to /opt/llm-system/llm-system.conf on every
# deploy, so it is the source of truth — not the live file on the box.
# Routine renewal (certbot.timer) only replaces the files under
# /etc/letsencrypt/live/ and reloads nginx itself; it does not touch this
# file. If certbot's installer is ever re-run by hand (e.g. adding a
# domain), copy its edits back here before the next deploy, or they're
# overwritten by the next `git push origin main:deploy`.
#
#   sudo mv /tmp/llm-system.conf /etc/nginx/sites-available/llm-system
#   sudo ln -s /etc/nginx/sites-available/llm-system /etc/nginx/sites-enabled/
#   sudo rm -f /etc/nginx/sites-enabled/default
#   sudo nginx -t && sudo systemctl reload nginx

# Apex + www — static "in development" holding page, HTTPS.
server {
    server_name career-lamp.com www.career-lamp.com;

    root /var/www/career-lamp-holding;
    index index.html;

    location / {
        try_files $uri $uri/ =404;
    }

    listen 443 ssl;
    listen [::]:443 ssl ipv6only=on;
    ssl_certificate /etc/letsencrypt/live/career-lamp.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/career-lamp.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

# dev-test — the actual app, HTTPS.
server {
    server_name dev-test.career-lamp.com;

    root /var/www/llm-system;
    index index.html;

    client_max_body_size 20m;          # uploaded documents exceed nginx's 1m default

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Hashed build assets — safe to cache hard.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA client-side routing fallback.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Server-Sent Events: no buffering, keep the upstream open, no timeout.
    location = /events {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 24h;
        chunked_transfer_encoding off;
    }

    # API surface.
    location ~ ^/(auth|conversations|files|documents|settings|health)(/|$) {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    listen 443 ssl;
    listen [::]:443 ssl;
    ssl_certificate /etc/letsencrypt/live/career-lamp.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/career-lamp.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

# HTTP → HTTPS redirects (certbot's standard pattern). Also the default
# server for port 80, so a bare-IP or unmatched-Host request 404s instead
# of falling through to a domain block.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name career-lamp.com www.career-lamp.com;

    if ($host = www.career-lamp.com) {
        return 301 https://$host$request_uri;
    }
    if ($host = career-lamp.com) {
        return 301 https://$host$request_uri;
    }

    return 404;
}

server {
    listen 80;
    listen [::]:80;
    server_name dev-test.career-lamp.com;

    if ($host = dev-test.career-lamp.com) {
        return 301 https://$host$request_uri;
    }

    return 404;
}
