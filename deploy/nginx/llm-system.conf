# llm-system — career-lamp.com (holding page) + dev-test.career-lamp.com (app).
# HTTP only for now — see deploy/README.md "Accepted risks" re: TLS.
#
#   sudo mv /tmp/llm-system.conf /etc/nginx/sites-available/llm-system
#   sudo ln -s /etc/nginx/sites-available/llm-system /etc/nginx/sites-enabled/
#   sudo rm -f /etc/nginx/sites-enabled/default
#   sudo nginx -t && sudo systemctl reload nginx

# Apex + www — static "in development" holding page. Also the default block,
# so requests straight to the EC2 IP land here instead of the app.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name career-lamp.com www.career-lamp.com;

    root /var/www/career-lamp-holding;
    index index.html;

    location / {
        try_files $uri $uri/ =404;
    }
}

# dev-test — the actual app (unchanged from before, just renamed off the bare IP).
server {
    listen 80;
    listen [::]:80;
    server_name dev-test.career-lamp.com;

    root /var/www/llm-system;
    index index.html;

    client_max_body_size 20m;          # uploaded documents exceed nginx's 1m default

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Hashed build assets — safe to cache hard.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA client-side routing fallback.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Server-Sent Events: no buffering, keep the upstream open, no timeout.
    location = /events {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 24h;
        chunked_transfer_encoding off;
    }

    # API surface.
    location ~ ^/(auth|conversations|files|documents|settings|health)(/|$) {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}